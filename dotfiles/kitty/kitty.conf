# -----------------------------------------------------------------------------
# Font Configuration
# -----------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# -----------------------------------------------------------------------------
# Window & Padding & Translucency
# -----------------------------------------------------------------------------
window_padding_width 12
background_opacity   0.75
confirm_os_window_close 0

# -----------------------------------------------------------------------------
# Cursor & Mouse
# -----------------------------------------------------------------------------
cursor_shape          beam
cursor_blink_interval 0.5
mouse_hide_wait       3.0
url_color             #88c0d0
url_style             curly

# -----------------------------------------------------------------------------
# Nord Color Scheme
# -----------------------------------------------------------------------------
foreground            #d8dee9
background            #2e3440
selection_foreground  #2e3440
selection_background  #88c0d0

# Cursor colors
cursor                #d8dee9
cursor_text_color     #2e3440

# Black (Polar Night)
color0                #3b4252
color8                #4c566a

# Red (Aurora)
color1                #bf616a
color9                #bf616a

# Green (Aurora)
color2                #a3be8c
color10               #a3be8c

# Yellow (Aurora)
color3                #ebcb8b
color11               #ebcb8b

# Blue (Frost)
color4                #81a1c1
color12               #81a1c1

# Magenta (Aurora)
color5                #b48ead
color13               #b48ead

# Cyan (Frost)
color6                #88c0d0
color14               #8fbcbb

# White (Snow Storm)
color7                #e5e9f0
color15               #eceff4

# -----------------------------------------------------------------------------
# Tab Bar (Matches Nord Palette)
# -----------------------------------------------------------------------------
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #2e3440
active_tab_background   #88c0d0
inactive_tab_foreground #d8dee9
inactive_tab_background #3b4252
