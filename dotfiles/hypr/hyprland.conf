
# Wallpaper
# Autostart bar, notification, wallpaper
exec-once = waybar
exec-once = dunst
exec-once = swaybg -i /home/josephl/Pictures/Roxy-wp.jpg -m fill
exec-once = vmware-user-suid-wrapper

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
}

# Monitor Configuration
monitor=,preferred,auto,1

#Mod Key
$mainMod = ALT

# Default Apps 
$terminal = kitty
$menu = rofi -show drun

#Autostarts
exec-once = waybar
exec-once = dunst

#Input
input {
 kb_layout = us
 follow_mouse = 1
 }

# Window Appearance
  general {
   gaps_in = 5
   gaps_out = 10
   border_size = 2
   col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
   col.inactive_border = rgba(313244aa)
   layout = dwindle
   }

# Window Blur & Rounding
  decoration {
    rounding = 8
    blur {
      enabled = true
      size = 5
      passes = 2
    }
  }

  dwindle {
  preserve_split = true
 }

 # Keybindings: core apps
 bind = $mainMod, RETURN, exec, $terminal
 bind = $mainMod, SPACE, exec, $menu
 bind = $mainMod SHIFT, E, exit,
 bind = $mainMod, F, fullscreen,
 bind = $mainMod, D, togglefloating,
 bind = $mainMod, ESCAPE, exec, hyprlock

 # Vim Window Focus
 bind = $mainMod, H, movefocus, l
 bind = $mainMod, L, movefocus, r
 bind = $mainMod, K, movefocus, u
 bind = $mainMod, j, movefocus, d

 # Move Windows
 bind = $mainMod SHIFT, H, movewindow, l
 bind = $mainMod SHIFT, L, movewindow, r
 bind = $mainMod SHIFT, K, movewindow, u
 bind = $mainMod SHIFT, J, movewindow, d

 # Workspaces 1-6
 bind = $mainMod, 1, workspace, 1
 bind = $mainMod, 2, workspace, 2
 bind = $mainMod, 3, workspace, 3
 bind = $mainMod, 4, workspace, 4
 bind = $mainMod, 5, workspace, 5
 bind = $mainMod, 6, workspace, 6
 bind = $mainMod, 7, workspace, 7

 # Mouse Window Control (SUPER + left/right click drag)
 bind = $mainMod, mouse:272, movewindow
