# Background using your wallpaper with subtle blur
background {
    monitor =
    path = /home/josephl/Pictures/Roxy-wp.jpg
    blur_passes = 1
    blur_size = 3
    noise = 0.0117
    contrast = 0.95
    brightness = 0.90
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME12"
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Translucent Input Box
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    
    # Translucent styling
    inner_color = rgba(17, 17, 27, 0.6)
    outer_color = rgba(137, 180, 250, 0.7)
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    
    position = 0, -50
    halign = center
    valign = center
}
